CONFIG_ZTEST=y
CONFIG_ZTEST_MOCKING=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_CALLBACKS=y
CONFIG_ZTEST_PARAMETER_COUNT=64

CONFIG_PSA_CRYPTO=y


# Avoid the creation of a flash.bin file when running. ZMS is mocked, and the RPL
# backup uses the simulated flash in RAM.
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="-flash_in_ram"
